<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustCloud Internal Web App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #14213d;
      background: #f6f8fb;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid #ccd6e2;
      border-radius: 8px;
      padding: 28px;
      background: white;
      box-shadow: 0 18px 54px rgba(28, 40, 64, .12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    p {
      margin: 0;
      color: #516173;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>TrustCloud internal web app</h1>
    <p>This demo resource is served over HTTPS on the private network.</p>
  </main>
</body>
</html>
