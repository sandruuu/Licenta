<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustCloud Logo Variants</title>
    <style>
      :root {
        color: #111;
        background: #f7f7f5;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 20px;
      }

      figure {
        margin: 0;
        max-width: 460px;
        border: 1px solid #d6d6d2;
        border-radius: 8px;
        background: white;
        padding: 20px;
        box-shadow: 0 10px 24px rgb(0 0 0 / 8%);
      }

      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
      }

      figcaption {
        margin-top: 12px;
        color: #555;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>TrustCloud Logo</h1>
    <figure>
      <img src="./network-shield-keyhole.svg?v=16" alt="Network shield with keyhole logo" />
      <figcaption>network-shield-keyhole</figcaption>
    </figure>
  </body>
</html>
