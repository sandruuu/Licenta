name: truststack

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  security:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
  private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.0.0/24

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: trustcloud-vault
    cap_add:
      - IPC_LOCK
    entrypoint: ["vault"]
    ports:
      - "127.0.0.1:8200:8200"
    command: ["server", "-config", "/vault/config/vault.hcl"]
    networks:
      security:
        ipv4_address: 172.24.0.5
    volumes:
      - vault-data:/vault/file
      - ./infrastructure/vault/config:/vault/config:ro
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_API_ADDR=http://vault:8200
      - SKIP_CHOWN=true
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1 || [ $$? -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.17
    container_name: trustcloud-vault-init
    depends_on:
      vault:
        condition: service_healthy
    networks:
      security:
    volumes:
      - ./infrastructure/vault/bootstrap.sh:/vault/bootstrap/bootstrap.sh:ro
      - ./infrastructure/vault/state:/vault/state
    environment:
      - VAULT_ADDR=http://vault:8200
      - TRUSTCLOUD_VAULT_TOKEN=${TRUSTCLOUD_VAULT_TOKEN:-trustcloud-vault-token}
    entrypoint: ["/bin/sh", "/vault/bootstrap/bootstrap.sh"]
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: trustcloud-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname=http://keycloak:8080
      - --hostname-strict=false
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      public:
        ipv4_address: 172.30.0.30
        aliases:
          - keycloak
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/import:/opt/keycloak/data/import:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trustcloud-postgres
    networks:
      security:
        aliases:
          - postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-trustcloud}
      - POSTGRES_USER=${POSTGRES_USER:-trustcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trustcloud}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustcloud} -d ${POSTGRES_DB:-trustcloud}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trustcloud-redis
    networks:
      security:
        aliases:
          - redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  pdp:
    build:
      context: ./pdp
      dockerfile: Dockerfile
    container_name: trustcloud
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      public:
        ipv4_address: 172.30.0.20
        aliases:
          - pdp
          - trustcloud
      security:
        ipv4_address: 172.24.0.20
        aliases:
          - pdp
          - trustcloud
    volumes:
      - ./pdp/data:/app/data
      - ./pdp/config.json:/app/config.json:ro
      - ./pdp/pa/dashboard/dist:/app/dashboard/dist:ro
    depends_on:
      vault-init:
        condition: service_healthy
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PDP_DATABASE_URL=${PDP_DATABASE_URL:-postgres://${POSTGRES_USER:-trustcloud}:${POSTGRES_PASSWORD:-trustcloud}@postgres:5432/${POSTGRES_DB:-trustcloud}?sslmode=disable}
      - PDP_REDIS_URL=${PDP_REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak-scim-sync:
    build:
      context: ./connectors/keycloak-scim-sync
    container_name: trustcloud-keycloak-scim-sync
    profiles:
      - directory-sync
    depends_on:
      pdp:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - public
    environment:
      - KEYCLOAK_BASE_URL=${KEYCLOAK_SCIM_SYNC_KEYCLOAK_BASE_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_SCIM_SYNC_REALM:-trustcloud-lab}
      - KEYCLOAK_AUTH_REALM=${KEYCLOAK_SCIM_SYNC_AUTH_REALM:-master}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_SCIM_SYNC_CLIENT_ID:-admin-cli}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_SCIM_SYNC_CLIENT_SECRET:-}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - PDP_BASE_URL=${KEYCLOAK_SCIM_SYNC_PDP_BASE_URL:-https://pdp:8443}
      - PDP_ORGANIZATION_ID=${KEYCLOAK_SCIM_SYNC_ORGANIZATION_ID:-}
      - PDP_SCIM_TOKEN=${KEYCLOAK_SCIM_SYNC_SCIM_TOKEN:-}
      - PDP_TLS_SKIP_VERIFY=${KEYCLOAK_SCIM_SYNC_PDP_TLS_SKIP_VERIFY:-true}
      - SYNC_INTERVAL=${KEYCLOAK_SCIM_SYNC_INTERVAL:-60s}
      - SYNC_ONCE=${KEYCLOAK_SCIM_SYNC_ONCE:-false}
      - DISABLE_MISSING_USERS=${KEYCLOAK_SCIM_SYNC_DISABLE_MISSING_USERS:-true}
      - DELETE_MISSING_GROUPS=${KEYCLOAK_SCIM_SYNC_DELETE_MISSING_GROUPS:-true}
      - SKIP_SERVICE_ACCOUNTS=${KEYCLOAK_SCIM_SYNC_SKIP_SERVICE_ACCOUNTS:-true}
    restart: unless-stopped

  public-dns:
    image: coredns/coredns:1.11.1
    container_name: trustcloud-public-dns
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
    networks:
      public:
        ipv4_address: 172.30.0.53
    volumes:
      - ./infrastructure/public-dns:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped

  private-dns:
    image: coredns/coredns:1.11.1
    container_name: trustcloud-private-dns
    networks:
      private:
        ipv4_address: 10.10.0.53
    volumes:
      - ./infrastructure/private-dns:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped

  web-app:
    build:
      context: ./infrastructure/web-app
    container_name: trustcloud-web-app
    networks:
      private:
        ipv4_address: 10.10.0.20
    restart: unless-stopped

  ssh-server:
    build:
      context: ./infrastructure/ssh-server
    container_name: trustcloud-ssh-server
    networks:
      private:
        ipv4_address: 10.10.0.30
    environment:
      - SSH_USER=${SSH_USER:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin}
    restart: unless-stopped

  rdp-desktop:
    build:
      context: ./infrastructure/rdp-desktop
    container_name: trustcloud-rdp-desktop
    networks:
      private:
        ipv4_address: 10.10.0.10
    environment:
      - RDP_USER=${RDP_USER:-admin}
      - RDP_PASSWORD=${RDP_PASSWORD:-admin}
    restart: unless-stopped

volumes:
  vault-data:
    driver: local
  keycloak-data:
    driver: local
  postgres-data:
    driver: local
