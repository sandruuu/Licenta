networks:
  gateway-net:
    driver: bridge

volumes:
  gateway-certs:
  gateway-config:

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ztna-gateway
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "8080:8080"
      - "80:80"
    volumes:
      - gateway-config:/app/config
      - gateway-certs:/app/certs
    environment:
      - CLOUD_URL=${CLOUD_URL:-https://pdp.ztna.local:8443}
      - GATEWAY_TENANT_ID=${GATEWAY_TENANT_ID:-tenant-1}
      - GATEWAY_ID=${GATEWAY_ID:-gateway-docker}
      - GATEWAY_ENDPOINT=${GATEWAY_ENDPOINT:-gateway.ztna.local:9443}
      - GATEWAY_ENROLLMENT_TOKEN=${GATEWAY_ENROLLMENT_TOKEN:-}
      - GATEWAY_CONTROL_ENABLED=${GATEWAY_CONTROL_ENABLED:-true}
      - PKI_URL=${PKI_URL:-}
      - PKI_TOKEN=${PKI_TOKEN:-}
      - PKI_PATH=${PKI_PATH:-pki_int}
      - PKI_ROLE_GATEWAY=${PKI_ROLE_GATEWAY:-ztna-gateway}
    networks:
      - gateway-net
