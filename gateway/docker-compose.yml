networks:
  gateway-net:
    driver: bridge
  truststack-private:
    external: true
    name: truststack_private

volumes:
  gateway-certs:
    name: ${GATEWAY_CERT_VOLUME:-gateway_gateway-certs}

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ${GATEWAY_CONTAINER_NAME:-trustgateway}
    restart: unless-stopped
    extra_hosts:
      - "pdp:host-gateway"
    ports:
      - "${GATEWAY_HOST_PORT:-9443}:9443"
    environment:
      GATEWAY_ENROLLMENT_TOKEN: ${GATEWAY_ENROLLMENT_TOKEN:-}
      GATEWAY_PUBLIC_ENDPOINT: ${GATEWAY_PUBLIC_ENDPOINT:-localhost:9443}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /app/certs/pa-ca.crt ] && [ -f /bootstrap/vault-pki-ca-cert.pem ]; then
          cp /bootstrap/vault-pki-ca-cert.pem /app/certs/pa-ca.crt
        fi
        exec ./gateway
    volumes:
      - ./config.json:/app/config.json:ro
      - ../pdp/data:/bootstrap:ro
      - gateway-certs:/app/certs
    networks:
      - gateway-net
      - truststack-private
