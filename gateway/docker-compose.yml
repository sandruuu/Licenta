networks:
  gateway-net:
    driver: bridge

volumes:
  gateway-certs:
    name: ${GATEWAY_CERT_VOLUME:-gateway_gateway-certs}

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ${GATEWAY_CONTAINER_NAME:-ztna-gateway}
    restart: unless-stopped
    extra_hosts:
      - "pdp:host-gateway"
    ports:
      - "${GATEWAY_HOST_PORT:-9443}:9443"
    environment:
      GATEWAY_ENROLLMENT_TOKEN: ${GATEWAY_ENROLLMENT_TOKEN:-}
    volumes:
      - ./config.json:/app/config.json:ro
      - gateway-certs:/app/certs
    networks:
      - gateway-net
