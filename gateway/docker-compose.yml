networks:
  gateway-net:
    driver: bridge

volumes:
  gateway-certs:
    name: ${GATEWAY_CERT_VOLUME:-gateway_gateway-certs}

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: ${GATEWAY_CONTAINER_NAME:-trustgateway}
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-9443}:9443"
    environment:
      GATEWAY_PA_URL: ${GATEWAY_PA_URL:?GATEWAY_PA_URL is required}
      GATEWAY_ENROLLMENT_TOKEN: ${GATEWAY_ENROLLMENT_TOKEN:?GATEWAY_ENROLLMENT_TOKEN is required}
      GATEWAY_PUBLIC_ENDPOINT: ${GATEWAY_PUBLIC_ENDPOINT:?GATEWAY_PUBLIC_ENDPOINT is required}
      GATEWAY_SESSION_REVALIDATION_INTERVAL: ${GATEWAY_SESSION_REVALIDATION_INTERVAL:-30s}
    volumes:
      - ./pa-ca.crt:/bootstrap/pa-ca.crt:ro
      - gateway-certs:/app/certs
    networks:
      - gateway-net
