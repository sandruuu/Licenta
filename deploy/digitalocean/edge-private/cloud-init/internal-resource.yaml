#cloud-config
package_update: true
package_upgrade: false

runcmd:
  - |
    set -eu
    curl -fsSL https://get.docker.com | sh
    systemctl enable --now docker

    mkdir -p /opt/trustcloud-internal-resource/html
    cat > /opt/trustcloud-internal-resource/html/index.html <<'HTML'
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>${resource_name}</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          color: #14213d;
          background: #f6f8fb;
        }
        main {
          width: min(520px, calc(100vw - 32px));
          border: 1px solid #ccd6e2;
          border-radius: 8px;
          padding: 28px;
          background: #fff;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>${resource_name}</h1>
        <p>Private TrustCloud demo resource. This page should be reachable only through the gateway.</p>
      </main>
    </body>
    </html>
    HTML

    docker run -d \
      --name trustcloud-internal-resource \
      --restart unless-stopped \
      -p ${resource_port}:80 \
      -v /opt/trustcloud-internal-resource/html:/usr/share/nginx/html:ro \
      nginx:1.27-alpine
