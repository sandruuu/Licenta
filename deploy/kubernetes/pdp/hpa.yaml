apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdp
  namespace: trustcloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdp
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
