apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdp-mtls
  namespace: trustcloud
  labels:
    app.kubernetes.io/name: pdp
    app.kubernetes.io/part-of: trustcloud
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: pdp-mtls.apps.fsisc.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdp
                port:
                  number: 8443
