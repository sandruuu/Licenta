apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdp
  namespace: trustcloud
  labels:
    app.kubernetes.io/name: pdp
    app.kubernetes.io/part-of: trustcloud
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdp
        app.kubernetes.io/part-of: trustcloud
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pdp
          image: trustcloud-pdp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: PDP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pdp-secrets
                  key: PDP_DATABASE_URL
            - name: PDP_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pdp-secrets
                  key: PDP_REDIS_URL
            - name: PDP_PKI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdp-secrets
                  key: PDP_PKI_TOKEN
            - name: PDP_TRANSIT_KEY
              valueFrom:
                secretKeyRef:
                  name: pdp-secrets
                  key: PDP_TRANSIT_KEY
            - name: PDP_FQDN
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_FQDN
            - name: PDP_TLS_DNS_NAMES
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_TLS_DNS_NAMES
            - name: PDP_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PUBLIC_ORIGIN
            - name: PDP_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_CORS_ORIGINS
            - name: PDP_FEDERATED_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_FEDERATED_CALLBACK_URL
            - name: PDP_WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_WEBAUTHN_RP_ID
            - name: PDP_WEBAUTHN_RP_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_WEBAUTHN_RP_ORIGINS
            - name: PDP_PKI_URL
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_URL
            - name: PDP_PKI_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_CA_FILE
            - name: PDP_PKI_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_SERVER_NAME
            - name: PDP_PKI_PATH
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_PATH
            - name: PDP_PKI_ROLE_PDP
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_ROLE_PDP
            - name: PDP_PKI_ROLE_DEVICE
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_ROLE_DEVICE
            - name: PDP_PKI_ROLE_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: pdp-config
                  key: PDP_PKI_ROLE_GATEWAY
          volumeMounts:
            - name: pdp-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: pdp-data
              mountPath: /app/data
            - name: vault-ca
              mountPath: /app/vault-ca
              readOnly: true
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /live
              port: https
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /live
              port: https
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /ready
              port: https
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pdp-config
          configMap:
            name: pdp-config
        - name: pdp-data
          persistentVolumeClaim:
            claimName: pdp-data
        - name: vault-ca
          secret:
            secretName: vault-ca
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pdp
                topologyKey: kubernetes.io/hostname
