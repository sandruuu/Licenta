apiVersion: v1
kind: ConfigMap
metadata:
  name: pdp-config
  namespace: trustcloud
data:
  PDP_FQDN: "mtls.trust-cloud.dev"
  PDP_TLS_DNS_NAMES: "trust-cloud.dev,mtls.trust-cloud.dev"
  PDP_PUBLIC_ORIGIN: "https://trust-cloud.dev"
  PDP_CORS_ORIGINS: "https://trust-cloud.dev"
  PDP_FEDERATED_CALLBACK_URL: "https://trust-cloud.dev/auth/federated/callback"
  PDP_WEBAUTHN_RP_ID: "trust-cloud.dev"
  PDP_WEBAUTHN_RP_ORIGINS: "https://trust-cloud.dev"
  PDP_PKI_URL: "https://vault.vault.svc.cluster.local:8200"
  PDP_PKI_CA_FILE: "/app/vault-ca/vault-ca.crt"
  PDP_PKI_SERVER_NAME: "vault.vault.svc.cluster.local"
  PDP_PKI_PATH: "pki_int"
  PDP_PKI_ROLE_PDP: "trustcloud"
  PDP_PKI_ROLE_DEVICE: "trustagent"
  PDP_PKI_ROLE_GATEWAY: "trustgateway"
  config.json: |
    {
      "pdp_fqdn": "mtls.trust-cloud.dev",
      "tls_dns_names": ["trust-cloud.dev", "mtls.trust-cloud.dev"],
      "public_origin": "https://trust-cloud.dev",
      "pki_ca_file": "/app/vault-ca/vault-ca.crt",
      "enrollment": {
        "certificate_validity_days": 30
      }
    }
