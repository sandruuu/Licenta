apiVersion: v1
kind: ConfigMap
metadata:
  name: pdp-config
  namespace: trustcloud
data:
  PDP_FQDN: "mtls.trust-cloud.dev"
  PDP_TLS_DNS_NAMES: "trust-cloud.dev,mtls.trust-cloud.dev"
  PDP_PUBLIC_ORIGIN: "https://trust-cloud.dev"
  PDP_CORS_ORIGINS: "https://trust-cloud.dev"
  PDP_FEDERATED_CALLBACK_URL: "https://trust-cloud.dev/auth/federated/callback"
  PDP_WEBAUTHN_RP_ID: "trust-cloud.dev"
  PDP_WEBAUTHN_RP_ORIGINS: "https://trust-cloud.dev"
  PDP_PKI_URL: "https://vault.vault.svc.cluster.local:8200"
  PDP_PKI_CA_FILE: "/app/vault-ca/vault-ca.crt"
  PDP_PKI_SERVER_NAME: "vault.vault.svc.cluster.local"
  PDP_PKI_PATH: "pki_int"
  PDP_PKI_ROLE_PDP: "trustcloud"
  PDP_PKI_ROLE_DEVICE: "trustagent"
  PDP_PKI_ROLE_GATEWAY: "trustgateway"
  config.json: |
    {
      "listen_addr": ":8443",
      "pdp_fqdn": "mtls.trust-cloud.dev",
      "tls_dns_names": ["trust-cloud.dev", "mtls.trust-cloud.dev"],
      "tls_cert": "/app/data/pdp-server-tls-cert.pem",
      "mtls_ca": "/app/data/vault-pki-ca-cert.pem",
      "pki_url": "https://vault.vault.svc.cluster.local:8200",
      "pki_token": "",
      "pki_path": "pki_int",
      "pki_role_pdp": "trustcloud",
      "pki_role_device": "trustagent",
      "pki_role_gateway": "trustgateway",
      "pki_transit_key": "trustcloud-key",
      "pki_ca_file": "/app/vault-ca/vault-ca.crt",
      "pki_server_name": "vault.vault.svc.cluster.local",
      "pki_timeout": 10000000000,
      "jwt_transit_key": "trustcloud-key",
      "totp_issuer": "TrustCloud",
      "session_expiry": 600000000000,
      "max_sessions": 5,
      "max_login_attempts": 5,
      "lockout_duration": 900000000000,
      "data_dir": "/app/data",
      "database_url": "",
      "redis_url": "",
      "pdp_key_encrypted_path": "/app/data/pdp_key.enc",
      "jwt_key_encrypted_path": "/app/data/jwt_signing_key.enc",
      "mfa_transit_key": "trustcloud-key",
      "mfa_secret_key_encrypted_path": "/app/data/mfa_secret.key.enc",
      "webauthn_rp_id": "trust-cloud.dev",
      "webauthn_rp_name": "TrustCloud",
      "webauthn_rp_origins": "https://trust-cloud.dev",
      "cors_origins": ["https://trust-cloud.dev"],
      "runtime": {
        "store_auto_save_interval": 60000000000,
        "session_cleanup_interval": 300000000000,
        "enrollment_cleanup_interval": 60000000000,
        "certificate_renew_before": 86400000000000,
        "http_read_timeout": 0,
        "http_read_header_timeout": 10000000000,
        "http_write_timeout": 0,
        "http_idle_timeout": 0,
        "http_shutdown_timeout": 15000000000,
        "readiness_drain_delay": 5000000000,
        "pki_renew_check_interval": 21600000000000,
        "event_buffer_size": 64,
        "catalog_ttl_seconds": 300,
        "auth_rate_limit_window": 900000000000,
        "auth_rate_limit_max": 10,
        "oidc_enrollment_token_ttl": 300000000000,
        "webauthn_challenge_ttl": 300000000000,
        "webauthn_cleanup_interval": 120000000000,
        "federation_cache_ttl": 21600000000000,
        "federation_http_timeout": 10000000000,
        "browser_auth_session_ttl": 300000000000,
        "admin_access_token_ttl": 300000000000,
        "admin_session_idle_ttl": 1800000000000,
        "admin_session_absolute_ttl": 28800000000000,
        "agent_session_access_token_ttl": 300000000000,
        "agent_session_idle_ttl": 1800000000000,
        "agent_session_absolute_ttl": 28800000000000,
        "csrf_cookie_max_age_seconds": 3600,
        "enroll_rate_limit_window": 60000000000,
        "enroll_rate_limit_max": 5,
        "gateway_revoke_timeout": 5000000000,
        "resource_session_renew_before": 60000000000
      },
      "public": {
        "federated_callback_url": "https://trust-cloud.dev/auth/federated/callback",
        "oidc_default_scopes": "openid profile email",
        "oidc_default_claim_mapping": {
          "username": "preferred_username",
          "email": "email",
          "groups": "groups"
        },
        "resource_default_ports": {
          "web": 443,
          "ssh": 22,
          "rdp": 3389
        }
      },
      "gateway": {
        "certificate_validity_days": 7,
        "enrollment_token_ttl": 3600000000000
      },
      "enrollment": {
        "certificate_validity_days": 1,
        "browser_session_ttl": 300000000000
      },
      "geo": {
        "provider_url": "https://ipapi.co/{ip}/json/",
        "http_timeout": 3000000000,
        "cache_ttl": 3600000000000,
        "cache_max_entries": 10000,
        "same_area_distance_km": 50,
        "suspicious_travel_speed_kmh": 500,
        "impossible_travel_speed_kmh": 900
      },
      "risk": {
        "device_data_critical_after": 1800000000000,
        "device_data_stale_after": 600000000000,
        "device_data_critical_points": 30,
        "device_data_stale_points": 15,
        "no_device_health_points": 25,
        "health_excellent_min": 80,
        "health_good_min": 60,
        "health_fair_min": 40,
        "health_good_points": 10,
        "health_fair_points": 20,
        "health_poor_points": 35,
        "critical_check_points": {
          "Firewall": 5,
          "Antivirus": 5,
          "Disk Encryption": 3,
          "Password & Lock": 2
        },
        "failed_attempts_high": 5,
        "failed_attempts_medium": 3,
        "failed_attempts_low": 1,
        "failed_attempts_high_points": 20,
        "failed_attempts_medium_points": 10,
        "failed_attempts_low_points": 5,
        "business_hours_start": 8,
        "business_hours_end": 18,
        "business_days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "outside_business_points": 10,
        "night_hours_start": 0,
        "night_hours_end": 6,
        "night_hours_points": 5,
        "new_device_points": 10,
        "new_location_points": 5,
        "protocol_points": {
          "rdp": 10,
          "ssh": 5,
          "http": 0,
          "https": 0
        },
        "unknown_protocol_points": 5,
        "impossible_travel_points": 30,
        "suspicious_geo_velocity_kmh": 500,
        "suspicious_geo_velocity_points": 15,
        "max_anomaly_points": 25,
        "max_score": 100
      }
    }

