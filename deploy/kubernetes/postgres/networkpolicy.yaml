apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pdp-to-postgres
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trustcloud
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pdp
      ports:
        - protocol: TCP
          port: 5432
